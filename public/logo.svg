<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
  </defs>
  
  <!-- Sun Rising Arc -->
  <circle cx="50" cy="50" r="42" stroke="url(#sunGrad)" stroke-width="4" stroke-dasharray="160 50" stroke-linecap="round" />
  
  <!-- Inner Sun Core -->
  <circle cx="50" cy="38" r="14" fill="url(#sunGrad)" opacity="0.9" />
  
  <!-- Left Sprout Leaf -->
  <path d="M50 78 C35 78 26 62 34 46 C42 44 50 56 50 78 Z" fill="url(#leafGrad)" />
  
  <!-- Right Leaf -->
  <path d="M50 78 C65 78 74 62 66 46 C58 44 50 56 50 78 Z" fill="url(#leafGrad)" opacity="0.85" />
  
  <!-- Central Growth Stem / Aqua Wave -->
  <path d="M49 84 C49 60 51 55 51 40" stroke="url(#blueGrad)" stroke-width="3.5" stroke-linecap="round" />
</svg>
